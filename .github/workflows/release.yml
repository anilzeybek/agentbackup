name: Release Binaries & Homebrew

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball & SHA-256
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE="agentbackup-${TAG}-${TARGET}.tar.gz"
          STAGE="dist/${TARGET}"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/agentbackup" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "dist/${ARCHIVE}" -C "$STAGE" agentbackup README.md LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256")
          else
            (cd dist && shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256")
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub Release & Homebrew
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag & version
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Combine SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure GitHub Release exists and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Update Homebrew formula in anilzeybek/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping Homebrew tap update."
            exit 0
          fi

          SHA_MACOS_ARM=$(awk '{print $1}' "artifacts/agentbackup-${TAG}-aarch64-apple-darwin.tar.gz.sha256")
          SHA_MACOS_X64=$(awk '{print $1}' "artifacts/agentbackup-${TAG}-x86_64-apple-darwin.tar.gz.sha256")
          SHA_LINUX_ARM=$(awk '{print $1}' "artifacts/agentbackup-${TAG}-aarch64-unknown-linux-gnu.tar.gz.sha256")
          SHA_LINUX_X64=$(awk '{print $1}' "artifacts/agentbackup-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256")

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/anilzeybek/homebrew-tap.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/agentbackup.rb <<EOF
          class Agentbackup < Formula
            desc "Cross-harness AI coding agent conversation backup CLI"
            homepage "https://github.com/anilzeybek/agentbackup"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/anilzeybek/agentbackup/releases/download/${TAG}/agentbackup-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              end
              on_intel do
                url "https://github.com/anilzeybek/agentbackup/releases/download/${TAG}/agentbackup-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MACOS_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/anilzeybek/agentbackup/releases/download/${TAG}/agentbackup-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
              on_intel do
                url "https://github.com/anilzeybek/agentbackup/releases/download/${TAG}/agentbackup-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "agentbackup"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/agentbackup --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentbackup.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "agentbackup ${TAG}"
            git push origin HEAD
          fi
