[package]
name = "agentbackup"
version = "0.1.1"
edition = "2021"
description = "Cross-harness AI coding agent conversation backup CLI (Antigravity, Claude Code, Codex CLI, OpenCode, Pi, DeepSeek Harness)"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
zstd = "0.13"
